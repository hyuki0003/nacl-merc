# IEMOCAP intra-dataset self-supervised pretraining configuration (MMAE + NACL).
# Used as the stage-1 config by main_intradataset.py for IEMOCAP runs.
iemocap:

  seed: 69
  device: "cuda:0"
  data_dir_path: "data"
  save_model_checkpoint: "model_checkpoints/iemocap"
  save_analysis_path: "save/analysis/iemocap"

  # Dataset statistics (108/12/31 dialogue split)
  n_train_dialogues: 108
  n_train_utterances: 3200
  n_valid_dialogues: 12
  n_valid_utterances: 400
  n_test_dialogues: 31
  n_test_utterances: 943

  modalities: "atv" # ["a", "t", "v", "at", "tv", "av", "atv"]

  hybrid: false
  specific: false

  # Stage control: run self-supervised pretraining from the beginning.
  from_begin: true

  # Optimization
  epochs: 300
  batch_size: 12
  scheduler: "cosineLR_linearWarmUp" # [None, stepLR, multistepLR, reduceLR, cyclicLR, cosineLR, cosineLR_linearWarmUp]
  T: 5 # warmup epochs
  learning_rate: 0.0001
  weight_decay: 0.001
  max_grad_value: -1

  # Architecture
  encoder_layers: 2
  encoder_attention_heads: 6
  encoder_embed_dim: 384
  ffn_embed_scaler: 4 # ffn dim = encoder_embed_dim * 4
  num_classes: 6

  # Pretraining objectives (MMAE + NACL)
  do_NACL: true
  do_MAE: true
  do_VATT: false
  do_CE: false
  do_WCE: false

  # Node masking ratio (p) per modality
  mask_prob_a: 0.7
  mask_prob_t: 0.7
  mask_prob_v: 0.7

  topk: 3            # NACL neighbors (k)
  temperature: 0.1   # NACL temperature (tau)
  NACL_lambda: 1     # NACL weight (lambda_con)
  MAE_lambda: 1      # MMAE reconstruction weight

  # Regularization
  dropout: 0.3
  attention_dropout: 0.
  act_dropout: 0.0

  # Graph encoder
  centrality: "degree" # [degree, eigen]
  max_dist: 51
  num_edge_dis: 51
  multi_hop_max_dist: 51
  edge_type: multi_hop # [single_hop, multi_hop]
  apply_graphormer_init: false
  activation_fn: "gelu"
  encoder_normalize_before: true
  pre_layernorm: true
