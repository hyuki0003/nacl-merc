# IEMOCAP 4-way fine-tuning / evaluation configuration (paper setting).
# Used as the stage-2 (target) config by main_crossdataset.py and main_intradataset.py.
iemocap_4:

  seed: 69
  device: "cuda:0"
  data_dir_path: "data"
  save_model_checkpoint: "model_checkpoints/iemocap_4"
  save_analysis_path: "save/analysis/iemocap_4"

  # Dataset statistics (108/12/31 dialogue split)
  n_train_dialogues: 108
  n_train_utterances: 3200
  n_valid_dialogues: 12
  n_valid_utterances: 400
  n_test_dialogues: 31
  n_test_utterances: 943

  modalities: "atv" # ["a", "t", "v", "at", "tv", "av", "atv"]

  # Stage control
  do_finetune: true        # run supervised fine-tuning
  from_scratch: false      # true: skip pretraining, train encoder from random init
  unimodal_inference: false # true: missing-modality inference with the saved fine-tuned model

  hybrid: false
  specific: false

  # Optimization
  epochs: 100
  batch_size: 12
  scheduler: "cosineLR" # [None, stepLR, multistepLR, reduceLR, cyclicLR, cosineLR, cosineLR_linearWarmUp]
  T: 15 # scheduler period
  learning_rate: 0.0001
  weight_decay: 0.
  max_grad_value: -1

  # Objectives
  do_CE: true
  do_WCE: false
  do_VATT: false
  do_DGI: false
  do_NACL: true           # NACL as auxiliary alignment regularizer during fine-tuning
  topk: 7                 # NACL neighbors (k)
  temperature: 0.1        # NACL temperature (tau)
  NACL_lambda: 0.5        # NACL weight (lambda_con)
  VATT_lambda: 0.1

  # Fine-tuning strategy: full fine-tuning (no frozen encoder blocks) is best for 4-way
  freeze_prefixes: []

  # Regularization
  dropout: 0.3
  attention_dropout: 0.1
  act_dropout: 0.0

  # Graph encoder
  encoder_layers: 2
  encoder_attention_heads: 6
  encoder_embed_dim: 384
  ffn_embed_scaler: 4 # ffn dim = encoder_embed_dim * 4
  num_classes: 4
  centrality: "degree" # [degree, eigen]
  max_dist: 51
  num_edge_dis: 51
  multi_hop_max_dist: 51
  edge_type: multi_hop # [single_hop, multi_hop]
  apply_graphormer_init: false
  activation_fn: "gelu"
  encoder_normalize_before: true
  pre_layernorm: false
