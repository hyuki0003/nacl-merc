# MELD self-supervised pretraining configuration for the IEMOCAP 6-way transfer
# (MMAE + NACL, paper setting: mask 0.7, top-k 3, temperature 0.7 — Table 1).
# Usage:
#   python main_crossdataset.py --pretrain_dataset meld --finetune_dataset iemocap \
#       --pretrain_config config/meld_pretrain_6way.yaml
meld:

  seed: 69
  device: "cuda:0"
  data_dir_path: "data"
  save_model_checkpoint: "model_checkpoints/meld"
  save_analysis_path: "save/analysis/meld"

  # Dataset statistics (all 1,432 dialogues are used for pretraining)
  n_train_dialogues: 1432
  n_train_utterances: 13708

  modalities: "atv"

  hybrid: false
  specific: false

  # Stage control: run self-supervised pretraining from the beginning.
  # Set false to reuse an existing pretrained checkpoint
  # (model_checkpoints/meld_<target>/pretrain_atv_best_model.pt).
  from_begin: true

  # Optimization
  epochs: 300
  batch_size: 128
  scheduler: "cosineLR_linearWarmUp" # [stepLR, multistepLR, reduceLR, cyclicLR, cosineLR, cosineLR_linearWarmUp]
  T: 5 # warmup epochs
  learning_rate: 0.0003
  weight_decay: 0.03
  max_grad_value: -1

  # Architecture
  encoder_layers: 2
  encoder_attention_heads: 6
  encoder_embed_dim: 384
  ffn_embed_scaler: 4 # ffn dim = encoder_embed_dim * 4
  num_classes: 7

  # Pretraining objectives (MMAE + NACL)
  do_NACL: true
  do_MAE: true
  do_VATT: false
  do_CE: false
  do_WCE: false

  # Node masking ratio (p) per modality — 6-way setting
  mask_prob_a: 0.7
  mask_prob_t: 0.7
  mask_prob_v: 0.7

  topk: 3            # NACL neighbors (k) — 6-way setting
  temperature: 0.7   # NACL temperature (tau) — 6-way setting
  NACL_lambda: 1     # NACL weight (lambda_con)
  MAE_lambda: 1      # MMAE reconstruction weight

  # Regularization
  dropout: 0.1
  attention_dropout: 0.
  act_dropout: 0.0

  # Graph encoder
  centrality: "degree" # [degree, eigen]
  max_dist: 51
  num_edge_dis: 51
  multi_hop_max_dist: 51
  edge_type: multi_hop # [single_hop, multi_hop]
  apply_graphormer_init: false
  activation_fn: "gelu"
  encoder_normalize_before: true
  pre_layernorm: true
